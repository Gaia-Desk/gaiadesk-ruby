name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - name: Build the gem and load it from outside the source tree
        shell: bash
        run: |
          gem build gaiadesk.gemspec
          gem install --local ./gaiadesk-*.gem
          cd "$RUNNER_TEMP" && ruby -e 'require "gaiadesk"; puts GaiaDesk::VERSION; exit(GaiaDesk::E2E.available? ? 0 : 1)'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec yard stats
